; ---------------------------------------------------------------------------
;  Trading 212 - account value in EUR
;  Setup: put your API key and secret in @Resources\Settings.inc
;  Keep this file ASCII-only: Rainmeter reads non-ASCII .ini text only
;  from UTF-16 files. Use character references such as #Euro# instead.
; ---------------------------------------------------------------------------

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
LeftMouseUpAction=[!CommandMeasure MeasureScript "Refresh()"]
ContextTitle=Refresh now
ContextAction=[!CommandMeasure MeasureScript "Refresh()"]
ContextTitle2=Edit settings
ContextAction2=["#@#Settings.inc"]
ContextTitle3=-
ContextTitle4=Reload skin
ContextAction4=[!Refresh]

[Metadata]
Name=Trading 212
Author=Dzhay
Information=Shows the value of a Trading 212 account in EUR and todays change. Requires a Trading 212 API key and secret with the Account data permission only.
Version=1.0
License=GPL-3.0-or-later

[Variables]
; Defaults - overridden by Settings.inc below.
ApiKey=
ApiSecret=
RefreshSeconds=60

@IncludeSettings=#@#Settings.inc
@IncludeDefaults=#@#Variables.inc

; ---------------------------------------------------------------------------
;  Measures
; ---------------------------------------------------------------------------

[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Portfolio.lua
; Every 5s: lets the script notice a key saved into Settings.inc.
UpdateDivider=5

; Starts disabled: Portfolio.lua sets the Basic auth Header from the key and
; secret, then enables it. Poll interval = Update x UpdateRate = 60s by
; default, well inside the endpoint's 1 request / 5s limit.
[MeasureSummary]
Measure=WebParser
URL=#BaseUrl#/api/v0/equity/account/summary
RegExp=(?s)^(.*)$
UpdateRate=#RefreshSeconds#
Flags=ForceReload | NoCookies
LogSubstringErrors=0
Disabled=1
FinishAction=[!CommandMeasure MeasureScript "OnData()"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnError('connect')"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnError('parse')"]

[MeasureSummaryJson]
Measure=WebParser
URL=[MeasureSummary]
StringIndex=1

; ---------------------------------------------------------------------------
;  Meters
; ---------------------------------------------------------------------------

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#SkinWidth#,#SkinHeight#,8 | Fill Color #ColorBackground# | StrokeWidth 0

[MeterLabel]
Meter=String
X=#PaddingX#
Y=14
FontFace=#FontFace#
FontSize=8.5
FontColor=#ColorTextDim#
StringCase=Upper
AntiAlias=1
Text=Trading 212

[MeterTotal]
Meter=String
X=#PaddingX#
Y=32
FontFace=#FontFaceValue#
FontSize=23
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1
Text=#TotalText#

[MeterChange]
Meter=String
X=#PaddingX#
Y=68
FontFace=#FontFace#
FontSize=9.5
FontColor=#ChangeColor#
AntiAlias=1
DynamicVariables=1
Text=#ChangeText#

[MeterStatus]
Meter=String
X=#PaddingX#
Y=90
FontFace=#FontFace#
FontSize=8
FontColor=#StatusColor#
AntiAlias=1
DynamicVariables=1
Text=#StatusText#

